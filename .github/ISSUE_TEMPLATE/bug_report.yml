name: Bug report
description: Report a reproducible problem in CemuX.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include passwords, tokens, or other sensitive information.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and where in CemuX did you see it?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest program or sequence of actions that reproduces the problem.
      placeholder: |
        1. Open CemuX
        2. Enter ...
        3. Select ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and versions
      description: Include operating system/device, Flutter version, and Dart version if known.
      placeholder: e.g. macOS 15, Flutter ..., Dart ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant error output or logs. Remove secrets and personal information.
      render: text
    validations:
      required: false
