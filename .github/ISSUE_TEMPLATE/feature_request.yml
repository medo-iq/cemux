name: Feature request
description: Propose an educational or product improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Focus on the learner problem and distinguish suggestions from current behavior.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or learning problem would this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or experience you would like.
    validations:
      required: true
  - type: textarea
    id: educational-value
    attributes:
      label: Educational value
      description: How would this help someone learn or teach computer architecture?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you considered?
    validations:
      required: false
